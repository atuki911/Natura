# ジャンル別アプリ（apps/*）を Android 用にビルドする。
#
# - いつも: デバッグ版 APK を作る（スマホに入れて試せる）→ Actions の「Artifacts」からダウンロード
# - 署名鍵のシークレットがあれば: Google Play に出せるリリース版 AAB も作る
#     ANDROID_KEYSTORE_BASE64   … 署名鍵ファイル（.jks）を base64 にした文字列
#     ANDROID_KEYSTORE_PASSWORD … 鍵ストアのパスワード
#     ANDROID_KEY_ALIAS         … 鍵の別名
#     ANDROID_KEY_PASSWORD      … 鍵のパスワード
#   作り方は RELEASE.md を参照。
name: Android build

on:
  push:
    paths:
      - 'apps/**'
      - 'factory/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'factory/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: apps
        run: echo "apps=$(ls -d apps/*/android 2>/dev/null | cut -d/ -f2 | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  android:
    needs: list
    if: needs.list.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.list.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: アプリの中身を工場でビルド
        run: node ../../factory/cli.js app build ${{ matrix.app }}
      - name: ストア公開前チェック（警告のみ）
        run: node ../../factory/cli.js app check ${{ matrix.app }}
      - run: npm ci
      - run: npx cap sync android
      - name: デバッグ版 APK
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
      - name: リリース版 AAB（署名鍵のシークレットがあるときだけ）
        working-directory: apps/${{ matrix.app }}/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NATURA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NATURA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NATURA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::署名鍵のシークレットが無いのでリリース版はスキップしました（RELEASE.md 参照）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          NATURA_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release-aab
          path: apps/${{ matrix.app }}/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
