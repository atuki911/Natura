<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Natura 起業リサーチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="brand">
      <a class="brand-name" href="#cases">Natura</a>
      <p class="brand-sub">海外のAI個人起業を、日本の事業計画に。</p>
    </div>
    <p class="brand-meta" id="brand-meta"></p>
  </header>
  <nav class="tabs" id="tabs" aria-label="メインメニュー">
    <a href="#cases" data-tab="cases">事例</a>
    <a href="#match" data-tab="match">相性診断</a>
    <a href="#trends" data-tab="trends">傾向</a>
    <a href="#leads" data-tab="leads">新着候補</a>
    <a href="#legal" data-tab="legal">法規制チェック</a>
    <a href="#sim" data-tab="sim">収益シミュレーター</a>
    <a href="#notes" data-tab="notes">マイノート</a>
    <a href="#guide" data-tab="guide">使い方</a>
  </nav>
  <main id="view" class="view" tabindex="-1"></main>
  <footer class="foot">
    <p id="foot-disclaimer"></p>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button type="button" class="btn ghost" data-action="modal-close">閉じる</button>
    </div>
    <p class="modal-note" id="modal-note"></p>
    <textarea id="modal-text" spellcheck="false"></textarea>
  </div>
</div>
<script src="engine.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
